<!DOCTYPE html>
<html lang="en" data-theme="light" data-surface="desktop">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HCMOS · Slice 4 Disciplinary action &amp; fan-out (C8)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--green:#1FA24A;--blue:#0094D4;--yellow:#FBC02D;--red:#E5484D;--font:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;--r:12px;}
*{box-sizing:border-box;}html,body{margin:0;height:100%;}body{font-family:var(--font);background:#0b0f13;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
[data-theme="light"]{--bg:#EEF1F3;--surface:#fff;--surface2:#F6F8F9;--text:#15191D;--muted:#5C6770;--faint:#8A949C;--border:#E2E7EA;--field:#F6F8F9;--card-bd:#E2E7EA;--blur:0px;--card-bg:#fff;--shadow:0 8px 30px rgba(16,24,32,.08);}
[data-theme="dark"]{--bg:#0C1115;--surface:#141B20;--surface2:#1A2228;--text:#E7EDF1;--muted:#94A2AC;--faint:#697680;--border:#26313A;--field:#1A2228;--card-bd:#26313A;--blur:0px;--card-bg:#141B20;--shadow:0 12px 40px rgba(0,0,0,.5);}
[data-theme="glass"]{--bg:linear-gradient(135deg,#0E4D34,#08311E 60%,#0a2a4a);--surface:rgba(255,255,255,.14);--surface2:rgba(255,255,255,.10);--text:#F2F6F4;--muted:rgba(242,246,244,.8);--faint:rgba(242,246,244,.55);--border:rgba(255,255,255,.22);--field:rgba(255,255,255,.12);--card-bd:rgba(255,255,255,.28);--blur:16px;--card-bg:rgba(255,255,255,.12);--shadow:0 18px 60px rgba(0,0,0,.35);}
[data-theme="reduced"]{--bg:#06271A;--surface:#0C3B27;--surface2:#0A3220;--text:#fff;--muted:#CFE6DA;--faint:#9FC3B0;--border:#1C6A47;--field:#0A3220;--card-bd:#2C8A5E;--blur:0px;--card-bg:#0C3B27;--shadow:none;}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto;background:var(--bg);}
.frame{position:relative;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;color:var(--text);}
[data-surface="desktop"] .frame{width:1120px;height:660px;}
[data-surface="tablet"] .frame{width:760px;height:580px;}
[data-surface="mobile"] .frame{width:390px;height:740px;border-radius:30px;font-size:14px;}
[data-surface="kiosk"] .frame{width:680px;height:820px;font-size:17px;}
.svg{width:16px;height:16px;}

/* directory backdrop (reused kit) */
.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.hd h2{margin:0;font-size:16px;}
.scope{font-size:11px;color:var(--faint);}
.body{flex:1;overflow:auto;position:relative;}
.row{display:grid;grid-template-columns:1.6fr 1fr .9fr .9fr;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);}
[data-surface="mobile"] .row{grid-template-columns:1fr auto;}
[data-surface="mobile"] .row .hide{display:none;}
.who{display:flex;align-items:center;gap:10px;min-width:0;}
.av{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;}
.nm{font-weight:600;font-size:13px;}.sub{font-size:11px;color:var(--faint);}
.badge{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;display:inline-flex;gap:5px;align-items:center;}
.b-active{background:rgba(31,162,74,.14);color:var(--green);}
.b-suspended{background:rgba(251,192,45,.18);color:#9A6B00;}
.b-terminated{background:rgba(229,72,77,.14);color:var(--red);}
.b-rehire{background:rgba(0,148,212,.14);color:var(--blue);}
[data-theme="dark"] .b-suspended,[data-theme="glass"] .b-suspended,[data-theme="reduced"] .b-suspended{color:var(--yellow);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* modal */
.scrim{position:absolute;inset:0;background:rgba(8,12,16,.35);}
.mwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:26px;}
.modal{width:580px;max-width:97%;max-height:100%;background:var(--card-bg);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--card-bd);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;color:var(--text);}
[data-surface="mobile"] .modal{width:100%;height:100%;max-height:100%;border-radius:0;}
.mh{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--surface);}
.mh .ic{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mh .ic.warn{background:rgba(251,192,45,.16);color:#9A6B00;}
.mh .ic.susp{background:rgba(229,72,77,.13);color:var(--red);}
[data-theme="dark"] .mh .ic.warn,[data-theme="glass"] .mh .ic.warn,[data-theme="reduced"] .mh .ic.warn{color:var(--yellow);}
.mh h3{margin:0;font-size:16px;}
.mh .sub{font-size:11px;color:var(--faint);margin-top:1px;}
.mb{flex:1;overflow:auto;padding:16px 18px;}
.mf{padding:11px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;align-items:center;background:var(--surface);}
.mf .lft{margin-right:auto;font-size:11px;color:var(--faint);}

/* subject plate */
.subj{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--card-bd);margin-bottom:14px;}
.subj .av{width:38px;height:38px;font-size:13px;}
.subj .meta{flex:1;min-width:0;}
.subj .nm{font-size:14px;}
.subj .no{font:600 11.5px var(--mono);color:var(--muted);}

/* section heads + fields (kit) */
.shead{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:4px 0 11px;display:flex;align-items:center;gap:7px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 13px;margin-bottom:16px;}
[data-surface="mobile"] .fg{grid-template-columns:1fr;}
.field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field .req{color:var(--red);}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--field);color:var(--text);font:inherit;font-size:12.5px;resize:none;}
.field textarea{min-height:64px;line-height:1.5;}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);}
.full{grid-column:1/-1;}

/* action-type segmented choice */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
[data-surface="mobile"] .types{grid-template-columns:1fr;}
.tcard{border:1.5px solid var(--card-bd);border-radius:11px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;cursor:default;}
.tcard.sel-w{border-color:var(--yellow);background:rgba(251,192,45,.08);}
.tcard.sel-s{border-color:var(--red);background:rgba(229,72,77,.07);}
.tcard .tic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tcard.sel-w .tic{background:rgba(251,192,45,.18);color:#9A6B00;}
.tcard.sel-s .tic{background:rgba(229,72,77,.14);color:var(--red);}
.tcard:not(.sel-w):not(.sel-s) .tic{background:var(--surface2);color:var(--faint);}
[data-theme="dark"] .tcard.sel-w .tic,[data-theme="glass"] .tcard.sel-w .tic,[data-theme="reduced"] .tcard.sel-w .tic{color:var(--yellow);}
.tcard .tt{font-weight:700;font-size:13px;}
.tcard .td{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:2px;}
.tcard .rad{margin-left:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--card-bd);flex-shrink:0;}
.tcard.sel-w .rad{border-color:var(--yellow);background:radial-gradient(circle,#9A6B00 42%,transparent 46%);}
.tcard.sel-s .rad{border-color:var(--red);background:radial-gradient(circle,var(--red) 42%,transparent 46%);}

/* SoD block — issuer ≠ checker ≠ subject */
.sod{border:1px solid var(--card-bd);border-radius:12px;padding:13px;background:var(--surface2);margin-bottom:14px;}
.sod .sodh{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:11px;}
.sodgrid{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch;}
[data-surface="mobile"] .sodgrid{grid-template-columns:1fr;}
[data-surface="mobile"] .sodgrid .neq{display:none;}
.party{border:1px solid var(--card-bd);border-radius:10px;padding:10px;background:var(--card-bg);text-align:center;}
.party .rl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin-bottom:6px;}
.party .av{margin:0 auto 6px;width:32px;height:32px;font-size:11px;}
.party .pn{font-size:12px;font-weight:600;line-height:1.25;}
.party .pr{font-size:10px;color:var(--muted);}
.party.issuer .av{background:var(--blue);}
.party.checker .av{background:#7A5BD6;}
.party.subject .av{background:var(--yellow);color:#5a3d00;}
.neq{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--faint);font-size:15px;}
.sodnote{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;line-height:1.45;}
.sod.clash{border-color:var(--red);background:rgba(229,72,77,.06);}
.sod.clash .party.clash{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;}
.sodbad{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(229,72,77,.12);color:var(--red);font-size:11px;font-weight:600;display:flex;gap:7px;align-items:flex-start;line-height:1.4;}

/* manager resolution chip */
.resolve{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;background:rgba(0,148,212,.08);border:1px solid rgba(0,148,212,.28);margin-bottom:14px;}
.resolve .ic{color:var(--blue);flex-shrink:0;}
.resolve .rt{font-size:12px;line-height:1.4;}
.resolve b{font-weight:700;}
.resolve .auto{margin-left:auto;font:700 9px var(--mono);background:rgba(0,148,212,.14);color:var(--blue);border-radius:5px;padding:2px 6px;flex-shrink:0;}

/* fan-out (success) */
.fanhead{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;margin-bottom:6px;}
.fanhead.w{background:rgba(251,192,45,.12);}
.fanhead.s{background:rgba(229,72,77,.1);}
.fanhead .seal{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fanhead.w .seal{background:rgba(251,192,45,.2);color:#9A6B00;}
.fanhead.s .seal{background:rgba(229,72,77,.16);color:var(--red);}
[data-theme="dark"] .fanhead.w .seal,[data-theme="glass"] .fanhead.w .seal,[data-theme="reduced"] .fanhead.w .seal{color:var(--yellow);}
.fanhead .ht{font-weight:700;font-size:15px;}
.fanhead .hs{font-size:11.5px;color:var(--muted);margin-top:1px;}
.atom{margin-left:auto;font:700 9px var(--mono);background:rgba(31,162,74,.16);color:var(--green);border-radius:6px;padding:3px 7px;text-align:center;line-height:1.3;flex-shrink:0;}
.fan{position:relative;margin:8px 0 4px;padding-left:30px;}
.fan::before{content:"";position:absolute;left:12px;top:6px;bottom:18px;width:2px;background:var(--border);}
.fanitem{position:relative;display:flex;gap:11px;align-items:flex-start;padding:9px 11px;margin-bottom:7px;border-radius:10px;background:var(--surface2);border:1px solid var(--card-bd);}
.fanitem::before{content:"";position:absolute;left:-18px;top:18px;width:14px;height:2px;background:var(--border);}
.fanitem .node{position:absolute;left:-24px;top:13px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2px solid var(--card-bg);display:flex;align-items:center;justify-content:center;}
.fanitem .fic{width:30px;height:30px;border-radius:8px;background:var(--card-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);}
.fanitem .ft{font-size:12.5px;font-weight:600;}
.fanitem .fd{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
.fanitem .fchip{margin-left:auto;font:600 9.5px var(--mono);background:var(--card-bg);border:1px solid var(--border);border-radius:5px;padding:2px 6px;color:var(--faint);align-self:center;flex-shrink:0;}
.fanitem.flip{border-color:var(--yellow);background:rgba(251,192,45,.1);}
.fanitem.flip .node{background:var(--yellow);}
.fanitem.flip .fic{color:#9A6B00;}
[data-theme="dark"] .fanitem.flip .fic,[data-theme="glass"] .fanitem.flip .fic,[data-theme="reduced"] .fanitem.flip .fic{color:var(--yellow);}
/* rolled-back (error) variant */
.fan.rb::before{background:repeating-linear-gradient(var(--border),var(--border) 4px,transparent 4px,transparent 8px);}
.fanitem.rb{background:var(--surface);border-style:dashed;opacity:.72;}
.fanitem.rb .node{background:var(--faint);}
.fanitem.rb .ft{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted);}
.fanitem.rb .fchip{color:var(--red);border-color:rgba(229,72,77,.4);}

/* letter mini-preview */
.letter{margin-top:11px;border:1px solid var(--card-bd);border-radius:10px;background:#fff;color:#1a1a1a;padding:13px 15px;font-size:10px;line-height:1.55;position:relative;overflow:hidden;}
.letter .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e2e2e2;padding-bottom:7px;margin-bottom:8px;}
.letter .lt{font-weight:700;font-size:11px;letter-spacing:.04em;}
.letter .lco{font-size:8.5px;color:#888;text-align:right;}
.letter .lbar{height:5px;border-radius:3px;background:#eee;margin:4px 0;}
.letter .lbar.s{width:70%;}.letter .lbar.m{width:90%;}
.letter .lstamp{position:absolute;right:12px;bottom:10px;border:1.5px solid var(--red);color:var(--red);font:700 8px var(--mono);padding:2px 6px;border-radius:4px;transform:rotate(-8deg);opacity:.85;}
.letter .lprint{margin-top:8px;font-size:8.5px;color:#999;display:flex;gap:8px;}

/* banners + buttons (kit) */
.banner{margin-bottom:14px;padding:10px 12px;border-radius:9px;font-size:12px;display:flex;gap:8px;align-items:flex-start;line-height:1.45;}
.banner.off{background:rgba(251,192,45,.16);color:#9A6B00;border:1px solid rgba(251,192,45,.5);}
.banner.err{background:rgba(229,72,77,.14);color:var(--red);border:1px solid rgba(229,72,77,.4);}
.banner.ok{background:rgba(31,162,74,.16);color:var(--green);border:1px solid rgba(31,162,74,.4);}
.banner.info{background:rgba(0,148,212,.1);color:var(--blue);border:1px solid rgba(0,148,212,.3);}
[data-theme="dark"] .banner.off,[data-theme="glass"] .banner.off,[data-theme="reduced"] .banner.off{color:var(--yellow);}
.btn{border:none;border-radius:9px;padding:9px 15px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.p{background:var(--green);color:#fff;}.btn.g{background:transparent;border:1px solid var(--border);color:var(--text);}.btn.d{background:var(--red);color:#fff;}.btn.w{background:var(--yellow);color:#5a3d00;}
.btn[disabled]{opacity:.5;}
.tbc{font:700 9px var(--mono);letter-spacing:.05em;background:rgba(251,192,45,.2);color:#9A6B00;border-radius:5px;padding:2px 5px;}
[data-theme="dark"] .tbc,[data-theme="glass"] .tbc,[data-theme="reduced"] .tbc{color:var(--yellow);}
.skelrow{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--surface2),var(--field),var(--surface2));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:12px 0;}
@keyframes sh{to{background-position:-200% 0;}}
.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px;color:var(--muted);gap:11px;}
.lock .ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);}
.lock .ic.self{background:rgba(229,72,77,.12);color:var(--red);}
.lock h3{margin:0;color:var(--text);font-size:16px;}
.lock p{margin:0;font-size:13px;max-width:330px;line-height:1.5;}
.lock .why{margin-top:4px;font:600 11px var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--muted);}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px;gap:13px;color:var(--muted);}
.empty .ic{width:54px;height:54px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--faint);}
.empty h3{margin:0;color:var(--text);font-size:16px;}
.empty p{margin:0;font-size:12.5px;max-width:300px;line-height:1.5;}

/* profile header (suspended rendering) */
.prof{padding:0;}
.profhd{padding:18px 20px;display:flex;gap:15px;align-items:center;border-bottom:1px solid var(--border);position:relative;}
.profhd.susp{background:repeating-linear-gradient(135deg,rgba(251,192,45,.07),rgba(251,192,45,.07) 11px,transparent 11px,transparent 22px);}
.profhd .pav{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;flex-shrink:0;}
.profhd h2{margin:0 0 3px;font-size:20px;}
.profhd .pmeta{font:600 12px var(--mono);color:var(--muted);}
.suspband{display:flex;align-items:center;gap:9px;padding:10px 20px;background:rgba(251,192,45,.14);border-bottom:1px solid rgba(251,192,45,.4);font-size:12px;color:#9A6B00;}
[data-theme="dark"] .suspband,[data-theme="glass"] .suspband,[data-theme="reduced"] .suspband{color:var(--yellow);}
.suspband b{font-weight:700;}
.proftabs{display:flex;gap:4px;padding:9px 16px 0;border-bottom:1px solid var(--border);}
.proftab{font-size:12px;padding:7px 12px;color:var(--muted);border-bottom:2px solid transparent;}
.proftab.on{color:var(--text);border-bottom-color:var(--green);font-weight:600;}
.profbody{padding:16px 20px;}
.discrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;background:var(--surface2);border:1px solid var(--card-bd);margin-bottom:9px;}
.discrow .di{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.discrow.w .di{background:rgba(251,192,45,.18);color:#9A6B00;}
.discrow.s .di{background:rgba(229,72,77,.14);color:var(--red);}
[data-theme="dark"] .discrow.w .di,[data-theme="glass"] .discrow.w .di,[data-theme="reduced"] .discrow.w .di{color:var(--yellow);}
.discrow .dt{font-size:12.5px;font-weight:600;}
.discrow .dd{font-size:10.5px;color:var(--muted);margin-top:2px;}
.discrow .dtag{margin-left:auto;font:600 9.5px var(--mono);color:var(--faint);}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:9px 14px;background:#11161b;color:#cfd8de;border-bottom:1px solid #1e262d;font-size:11.5px;}
.bar .grp{display:flex;align-items:center;gap:5px;}
.bar .lbl{color:#7c8893;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px;}
.bar button{border:1px solid #2a333b;background:#1a2127;color:#aeb9c1;border-radius:6px;padding:4px 8px;cursor:pointer;font:inherit;font-size:11px;}
.bar button.on{background:var(--green);color:#fff;border-color:var(--green);}
.bar .ac{margin-left:auto;color:#6f7c85;}.bar .ac b{color:#9FE3BD;}
</style>
