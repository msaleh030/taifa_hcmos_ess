# Serves the built SPA and reverse-proxies the API. TLS is terminated by the
# edge nginx on the VPS (see infra/nginx/taifamining.tz.conf); this container
# listens on plain HTTP behind it.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets: long cache, hashed filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API → Fastify container.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
