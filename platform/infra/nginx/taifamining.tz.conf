# Edge nginx on the Hostinger VPS. Terminates TLS for taifamining.tz and proxies
# to the `web` container published on 127.0.0.1:8080 by docker-compose.
#
# Install: copy to /etc/nginx/sites-available/taifamining.tz, symlink into
# sites-enabled, obtain certs with:
#   sudo certbot --nginx -d taifamining.tz -d www.taifamining.tz
# certbot rewrites the listen/ssl_* lines below; the redirect server block is a
# starting point if you manage certs manually.

server {
  listen 80;
  listen [::]:80;
  server_name taifamining.tz www.taifamining.tz;
  # ACME challenge for certbot, then redirect everything to HTTPS.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name taifamining.tz www.taifamining.tz;

  # Managed by certbot after the first issuance:
  ssl_certificate     /etc/letsencrypt/live/taifamining.tz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taifamining.tz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Security headers (HSTS only after you've confirmed HTTPS works everywhere).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
